[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # esbuild bundles both CommonJS and ESM functions; pinned so verify-onchain.js
  # (ESM) works regardless of the platform default bundler.
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
